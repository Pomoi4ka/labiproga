name: Build & Deploy LaTeX PDFs

on:
  pull_request:
    branches: [bottomless-pit]
  push:
    branches: [bottomless-pit]
  workflow_dispatch:
    inputs:
      documents:
        description: "Space-separated doc names to build (empty = all)"
        required: false
        default: ""

# Least privilege at workflow level; deploy elevates per-job.
permissions:
  contents: read

# Per-ref so PR builds don't queue behind / block Pages deploys.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            graphviz \
            texlive-lang-cyrillic \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-bibtex-extra texlive-xetex texlive-luatex texlive-science \
            latexmk biber

      - name: Build PDFs
        run: make pdfs

      - name: Upload PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: dist/*.pdf
          if-no-files-found: error

      - name: Prepare Pages site
        run: |
          mkdir -p public
          cp dist/*.pdf public/
          {
            echo '<!doctype html><html><head><meta charset="utf-8">'
            echo '<title>Documents</title></head><body>'
            echo '<h1>PDF Documents</h1><ul>'
            for f in public/*.pdf; do
              b="$(basename "$f")"
              echo "<li><a href=\"${b}\">${b}</a></li>"
            done
            echo '</ul></body></html>'
          } > public/index.html

      # Only meaningful on deploy runs; skip on PRs.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
